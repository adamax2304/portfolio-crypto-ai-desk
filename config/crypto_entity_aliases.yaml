# Curated crypto entity aliases for catalyst / news symbol detection.
#
# Each key is the canonical ticker (uppercased, no /USDT — the matcher
# appends /USDT when emitting symbols for downstream code).
#
# `aliases` is a list of strings that will be matched against news titles
# via word-boundary regex.
#
# Matching rules (enforced by src/catalysts/entity_aliases.py):
#   * Aliases that are ALL UPPERCASE and ≤ 4 chars are matched
#     CASE-SENSITIVELY (so "BTC" matches but "btc" doesn't). This
#     protects common-word collisions ("one", "near", "link", "flow").
#   * Aliases with a space OR length ≥ 5 are matched CASE-INSENSITIVELY
#     ("Bitcoin", "Binance Coin", "Cardano").
#   * Longer aliases are tried before shorter ones (greedy).
#
# Keep this list focused on names that actually show up in scheduled
# RSS feeds. Curated, not exhaustive.

BTC:
  canonical_name: Bitcoin
  aliases: [Bitcoin, BTC]
  tags: [store_of_value, majors]

ETH:
  canonical_name: Ethereum
  aliases: [Ethereum, Ether, ETH]
  tags: [l1, smart_contracts, majors]

