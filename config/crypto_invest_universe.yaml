crypto_invest_universe:
  version: crypto_invest_liquid_60_v1
  enabled: true
  quote_currency: USDT
  selection_count: 60
  refresh_policy: manual_weekly_or_biweekly
  last_reviewed_at: "2026-08-06T22:49:55.239870Z"

  # Liquidity is ranked across the market, but a symbol is eligible for this
  # MEXC-live lane only when both the Binance data contract and MEXC execution
  # contract have enough history and are active.
  selection_rules:
    max_market_cap_rank: 250
    min_market_cap_usd: 200000000
    min_global_volume_24h_usd: 5000000
    min_binance_futures_age_days: 365
    min_mexc_contract_age_days: 180
    require_binance_usdt_perpetual: true
    require_mexc_api_contract: true
    min_active_derivatives_venues: 2
    score_weights:
      global_volume: 0.45
      aggregate_derivatives_volume: 0.30
      market_cap: 0.20
      venue_breadth: 0.05

