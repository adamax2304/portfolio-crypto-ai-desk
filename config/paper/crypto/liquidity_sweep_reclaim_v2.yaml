# Crypto Liquidity Sweep/Reclaim v2 - archived Paper experiment.
# Its active evidence was negative after costs and the confirmation funnel was
# mostly stale/invalid geometry. Kept only as a reversible configuration.
crypto_liquidity_sweep_reclaim_v2_paper:
  feature_flag: false
  strategy_id: crypto_liquidity_sweep_reclaim_v2
  paper_lane: paper_crypto_liquidity_sweep_reclaim_v2
  base_sweep_timeframe: 5m
  primary_exchange: bybit
  max_symbols: 60

  # Paper sample-broadening pass. Live remains disabled for liquidity sweep.
  recent_sweep_scan_bars: 36
  level_lookback_bars: 36
  level_touch_tolerance_bps: 20.0
  min_sweep_bps: 8.0
  min_wick_share: 0.45
  min_close_location: 0.60
  min_rvol: 1.05
  liquidation_window_minutes: 10
  min_liquidation_notional_usd: 20000
  liquidation_sources: [binance, bybit]
  liquidation_observation_sources: [binance, bybit, okx]
  min_oi_drop_pct: 0.10
  derivatives_freshness_minutes: 10
  liquidity_freshness_minutes: 10
  max_spread_bps: 22.0

  sessions:
    blocked: [asia, "off"]
    strict: [europe]
    preferred: [us]
  europe_strict:
    min_liquidation_notional_usd_multiplier: 1.50
    min_rvol_multiplier: 1.15
    min_oi_drop_pct_multiplier: 1.25
    require_two_htf_timeframes: false

  htf:
    enabled: true
    timeframes: [1h, 4h]
    lookback_bars: 90
    pivot_left_bars: 3
    pivot_right_bars: 3
    zone_width_atr: 0.35
    max_distance_bps: 140

  confirmation_profiles:
    RECLAIM_HOLD_5M_2BAR:
      profile_id: crypto_liquidity_sweep_reclaim_5m_hold2_paper_v2
      confirmation_timeframe: 5m
      hold_bars: 1
      confirmation_window_bars: 8
      level_hold_buffer_atr: 0.08
      min_reclaim_close_distance_atr: 0.02
      min_progress_atr: 0.02
      strict_europe: true
    RECLAIM_HOLD_15M_1BAR:
      profile_id: crypto_liquidity_sweep_reclaim_15m_hold1_paper_v2
      confirmation_timeframe: 15m
      hold_bars: 1
      confirmation_window_bars: 6
      level_hold_buffer_atr: 0.08
      min_reclaim_close_distance_atr: 0.03
      min_progress_atr: 0.03
      strict_europe: true

  stop_buffer_atr: 0.14
  max_stop_distance_pct: 0.055
  target_r: [1.0, 2.0, 3.0]
  max_entry_latency_seconds: 180
  max_holding_bars_by_profile:
    RECLAIM_HOLD_5M_2BAR: 72
    RECLAIM_HOLD_15M_1BAR: 48
  fee_profile: bybit_non_vip_usdt_perp

  min_clean_closed: 30
  min_forward_days: 28
  min_profit_factor: 1.25
  max_review_drawdown_usd: 250.0
  report_path: reports/CRYPTO_LIQUIDITY_SWEEP_RECLAIM_V2_PAPER.md
