# Stock liquidity-shock reclaim research lane. Paper only: no live route exists.
stocks_liquidity_shock_reclaim_v1_paper:
  feature_flag: true
  live_enabled: false
  strategy_id: stocks_liquidity_shock_reclaim_v1
  paper_lane: paper_stocks_liquidity_shock_reclaim_v1
  base_timeframe: 15m
  confirmation_timeframe: 1m
  use_default_universe: true
  recent_scan_bars: 4
  refresh_candidate_1m: true
  # Double per-pass coverage; the current source may fall back to delayed data.
  max_candidate_refresh_symbols: 24
  # Open paper positions are independently backfilled so exit tracking survives
  # a missed monitor cycle or process restart.
  refresh_open_position_1m: true
  open_position_refresh_interval_seconds: 30
  open_position_stale_after_seconds: 180
  refresh_base_15m_on_close: true
  base_refresh_delay_seconds: 5

  # The open and closing auction windows are deliberately excluded.  The
  # setup is a short-horizon liquidity recovery, not an opening-gap strategy.
  allowed_windows_et: ["09:45-11:30", "13:30-15:15"]
  level_lookback_bars: 8
  atr_periods: 14
  volume_lookback_bars: 20
  # Shared candidate envelope is the HELD profile selected on train.  FAST
  # applies its stricter overrides below and remains a speed control.
  min_flush_atr: 1.10
  max_flush_atr: 3.50
  min_flush_pct: 0.80
  min_rvol: 1.20
  min_level_breach_atr: 0.15
  min_idiosyncratic_drop_pct: 0.20
  max_market_drop_pct: 0.60
  max_sector_drop_pct: 1.10
  min_avg_dollar_volume_30d: 25000000
  min_bar_dollar_volume: 1500000
  min_price: 5.0

  blocked_news_lookback_hours: 36
  blocked_event_types:
    - earnings
    - guidance
    - legal_risk
    - offering_dilution
    - fda_clinical
    - management_change
  blocked_risk_actions: [block, review]

  reclaim_fraction: 0.40
  stop_buffer_atr: 0.10
  min_stop_distance_pct: 0.0035
  max_stop_distance_pct: 0.035
  target_r: [0.80, 1.35]
  target_fractions: [0.70, 0.30]
  move_stop_to_entry_after_tp1: true
  fixed_risk_usd: 10.0
  fee_profile: stock_etf_default
  stock_slippage:
    major: 0.0003
    liquid_alt: 0.0005
    illiquid_alt: 0.0010
  max_entry_latency_seconds: 1200
  clean_entry_latency_seconds: 180
  manual_telegram_signals:
    enabled: true
    max_age_seconds: 180
    profile_ids:
      - stocks_liquidity_shock_held_1m_structure_targets_paper_v1
    profile_labels:
      stocks_liquidity_shock_held_1m_structure_targets_paper_v1: HELD · структурные цели

  confirmation_profiles:
    FAST_1M_RECLAIM:
      # Archived: forward PF 0.36 after costs.
      enabled: false
      profile_id: stocks_liquidity_shock_fast_1m_paper_v1
      research_role: speed_control
      hold_bars: 1
      confirmation_window_bars: 8
      require_green: true
      require_progress: false
      max_holding_bars: 45
      min_flush_atr: 1.50
      max_flush_atr: 3.50
      min_flush_pct: 0.80
      min_rvol: 1.70
      min_idiosyncratic_drop_pct: 0.30
      max_market_drop_pct: 0.60
      max_sector_drop_pct: 1.10
      min_level_breach_atr: 0.15
    HELD_1M_RECLAIM:
      # Archived: 50 closes, negative net P&L and PF below 1 after costs.
      enabled: false
      profile_id: stocks_liquidity_shock_held_1m_paper_v1
      research_role: primary_candidate
      hold_bars: 2
      confirmation_window_bars: 12
      require_green: true
      require_progress: true
      max_holding_bars: 60
      min_flush_atr: 1.10
      max_flush_atr: 3.50
      min_flush_pct: 0.80
      min_rvol: 1.20
      min_idiosyncratic_drop_pct: 0.20
      max_market_drop_pct: 0.60
      max_sector_drop_pct: 1.10
      min_level_breach_atr: 0.15

    # Identical HELD entry cohort and structural stop. A trade is recorded
    # only when two genuine chart-structure targets exist; ATR fallback is
    # deliberately rejected so this remains a pure target-policy comparison.
    HELD_1M_STRUCTURE_TARGETS:
      enabled: true
      profile_id: stocks_liquidity_shock_held_1m_structure_targets_paper_v1
      research_role: structural_target_candidate
      activation_at: "2026-09-30T00:00:00+00:00"
      hold_bars: 2
      confirmation_window_bars: 12
      require_green: true
      require_progress: true
      max_holding_bars: 60
      min_flush_atr: 1.10
      max_flush_atr: 3.50
      min_flush_pct: 0.80
      min_rvol: 1.20
      min_idiosyncratic_drop_pct: 0.20
      max_market_drop_pct: 0.60
      max_sector_drop_pct: 1.10
      min_level_breach_atr: 0.15
      target_policy: pure_structure

    # Train-only winner from the paired stop grid; 0.15 ATR beyond the shock
    # low. Validation/test do not establish an edge, so this remains Paper.
    HELD_1M_WIDER_STOP_015:
      # Archived: 39 closes, negative net P&L and PF below 1 after costs.
      enabled: false
      profile_id: stocks_liquidity_shock_held_1m_buffer_015_paper_v1
      research_role: exploratory_wider_structural_stop
      activation_at: "2026-10-05T13:30:00+00:00"
      hold_bars: 2
      confirmation_window_bars: 12
      require_green: true
      require_progress: true
      max_holding_bars: 60
      min_flush_atr: 1.10
      max_flush_atr: 3.50
      min_flush_pct: 0.80
      min_rvol: 1.20
      min_idiosyncratic_drop_pct: 0.20
      max_market_drop_pct: 0.60
      max_sector_drop_pct: 1.10
      min_level_breach_atr: 0.15
      stop_buffer_atr: 0.15

  min_clean_closed: 30
  min_forward_days: 30
  min_profit_factor: 1.20
  max_review_drawdown_usd: 150.0
  report_path: reports/STOCKS_LIQUIDITY_SHOCK_RECLAIM_V1_PAPER.md
