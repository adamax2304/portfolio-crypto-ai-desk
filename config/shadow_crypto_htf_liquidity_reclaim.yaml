# Higher-timeframe liquidity reclaim, deliberately isolated from the existing
# 5m liquidity sweep lane.  It has no Paper or Live route.
crypto_htf_liquidity_reclaim_v1:
  # Archived 2026-09-30: no closed evidence and the scan monopolized the
  # derivatives cycle for minutes at a time.
  feature_flag: false
  strategy_id: crypto_htf_liquidity_reclaim_v1
  shadow_lane: shadow_crypto_htf_liquidity_reclaim
  primary_exchange: bybit
  max_symbols: 40

  structure_timeframe: 4h
  sweep_timeframe: 1h
  confirmation_timeframe: 15m
  structure_lookback_bars: 90
  pivot_left_bars: 3
  pivot_right_bars: 3
  zone_width_atr: 0.25

  # A one-hour bar must take a confirmed 4h zone, reject it with a meaningful
  # wick and close back through the level.  The force-order/OI checks describe
  # a completed deleveraging event rather than a blind dip-buy.
  min_sweep_atr: 0.15
  min_wick_share: 0.35
  min_close_location: 0.55
  min_rvol: 1.10
  liquidation_window_minutes: 60
  min_liquidation_notional_usd: 50000
  # Diagnostic coverage only; do not require a third venue for an entry.
  liquidation_sources: [binance, bybit]
  liquidation_observation_sources: [binance, bybit, okx]
  min_oi_drop_pct: 0.50
  max_adverse_funding_8h: 0.0010
  max_spread_bps: 25.0
  derivatives_freshness_minutes: 10
  liquidity_freshness_minutes: 10

  # Early is the first closed 15m reclaim; held waits for two.  Both are
  # evaluated in parallel, never merged into a single evidence cohort.
  confirmation_window_bars: 4
  confirmation_progress_atr: 0.05
  max_oi_rebuild_pct: 1.50
  min_price_progress_atr: 0.05
  profiles:
    EARLY_RECLAIM: crypto_htf_liquidity_reclaim_early_v1
    HELD_RECLAIM: crypto_htf_liquidity_reclaim_held_v1

  require_btc_alignment: true
  btc_ema_bars: 20
  block_sessions: []
  stop_buffer_atr: 0.25
  max_stop_distance_pct: 0.08
  min_opposing_level_r: 2.50
  tp1_r: 1.00
  tp2_r: 1.75
  opposing_target_fraction: 0.95
  max_holding_bars: 192
  fee_profile: bybit_non_vip_usdt_perp

  min_clean_closed: 30
  min_forward_days: 28
  min_profit_factor: 1.25
  max_review_drawdown_usd: 250.0
  report_path: reports/CRYPTO_HTF_LIQUIDITY_RECLAIM_V1_SHADOW.md
