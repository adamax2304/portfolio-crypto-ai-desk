# Crypto Liquidity Sweep Reversal — isolated Shadow experiment.
# A setup exists only after an observed forced-liquidation event and a price
# sweep that closes back inside a prior liquidity level. Exchange public feeds
# are confirmation signals, not a complete liquidation tape, so their notional
# is never treated as an exact market-wide total. This module remains isolated:
# a separate, version-pinned bridge may mirror only its fresh clean rows to the
# common live preflight outbox.
crypto_liquidity_sweep_v1:
  # Archived 2026-09-30: 135 clean closes, PF 0.70 after costs.
  feature_flag: false
  strategy_id: crypto_liquidity_sweep_v1
  profile_id: crypto_liquidity_sweep_reversal_5m_v1
  shadow_lane: shadow_crypto_liquidity_sweep
  timeframe: 5m
  primary_exchange: bybit
  max_symbols: 40

  # The level is a prior 3h range extreme. A sweep must pierce it, then close
  # back inside the range with a substantial rejection wick.
  level_lookback_bars: 36
  level_touch_tolerance_bps: 12.0
  min_sweep_bps: 8.0
  min_wick_share: 0.45
  min_close_location: 0.60
  min_rvol: 1.25
  liquidation_window_minutes: 10
  min_liquidation_notional_usd: 50000
  # These two remain the admission data set. OKX is recorded separately below
  # so a third venue cannot silently reduce trade frequency during research.
  liquidation_sources: [binance, bybit]
  liquidation_observation_sources: [binance, bybit, okx]
  min_oi_drop_pct: 0.25
  derivatives_freshness_minutes: 10
  liquidity_freshness_minutes: 10
  max_spread_bps: 20.0
  block_sessions: [asia, "off"]

  stop_buffer_atr: 0.12
  max_stop_distance_pct: 0.035
  target_r: [1.0, 2.0, 3.0]
  max_holding_bars: 72
  fee_profile: bybit_non_vip_usdt_perp

  min_clean_closed: 30
  min_forward_days: 28
  min_profit_factor: 1.25
  max_review_drawdown_usd: 250.0
  report_path: reports/CRYPTO_LIQUIDITY_SWEEP_V1_SHADOW.md
