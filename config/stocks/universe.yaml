# Per-mode timeframe map. Used by data collectors to decide which intervals
# to pull from the source. yfinance intraday windows are limited (60d max
# for 15m, ~730d for 1h); the swing/invest modes lean on daily.
mode_timeframes:
  intraday: ["15m", "1h", "1d"]
  swing: ["1h", "1d"]
  invest: ["1d", "1wk"]

# Liquidity / risk floors. Symbols below these gates get demoted to
# watchlist or rejected outright. Tune by experience.
min_avg_dollar_volume_30d: 25_000_000   # avg dollar volume over 30 trading days
min_price: 5.0                          # avoid penny-stock noise
max_recent_gap_pct: 25.0                # symbols that gapped > X% in last session
                                        # need explicit gap-aware handling
