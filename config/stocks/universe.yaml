# Index ETFs used by StocksMarketRegimeAgent to classify risk-on / risk-off.
indices:
  - SPY
  - QQQ
  - IWM
  - DIA

# VIX (or its proxy) — pulled if available for volatility regime.
volatility_index: ^VIX

# Sector ETF map. SectorRotationAgent ranks these for sector strength and
# StockRelativeStrengthAgent uses them as a per-symbol benchmark.
sector_etfs:
  technology: XLK
  semiconductors: SMH
  financials: XLF
  energy: XLE
  consumer_discretionary: XLY
  healthcare: XLV
  communications: XLC
  industrials: XLI
  utilities: XLU
  real_estate: XLRE
  materials: XLB
  consumer_staples: XLP

