# Stocks entity aliases (PART 19, 2026-06-03).
#
# Read by ``EntityAliasMatcher.load_stocks(project_root)``. Used by the
# catalyst layer / catalyst-scan / Opus reviews to map company names and
# product references in news headlines back to the stocks universe
# tickers so the catalyst stays symbol-aware.
#
# Schema (per ticker):
#   <TICKER>:
#     canonical_name: "..."        # display name (optional)
#     aliases: [ "name1", "name2", ... ]   # case-insensitive unless the
#                                          # alias is a short all-caps
#                                          # ticker (handled by matcher)
#     tags: [ ... ]                # optional sector / narrative tags
#
# False-positive safety: short tickers (≤4 chars) are matched case-
# sensitively by the matcher so "AMD" hits "AMD" but not "amd"; common
# words ("apple", "broadcom") are kept as multi-word aliases so a plain
# noun match requires the full name.

# ---------------------------------------------------------------------------
# Mega caps
# ---------------------------------------------------------------------------
AAPL:
  canonical_name: Apple Inc.
  aliases:
    - "Apple Inc"
    - "Apple Computer"
    - "Cupertino"
    - "Tim Cook"
  # Only accepted in official/reputable *stock headlines* by the resolver.
  # Product / market context avoids matching agricultural "apple" headlines.
  headline_aliases: [ "Apple", "Apple Maps", "Apple stock", "Apple shares" ]
  headline_context_terms: [ "stock", "stocks", "share", "shares", "market value", "valuation", "earnings", "revenue", "iphone", "ipad", "mac", "company" ]
  tags: [ technology, mega_cap ]

