  # does not list HYPE/USDT in this local MVP exchange profile.
  - HYPE/USDT

narratives:
  AI:
    symbols: [TAO, FET, RENDER, NEAR, ICP]
    keywords:
      - AI
      - artificial intelligence
      - machine learning
      - compute
  RWA:
    symbols: [ONDO, LINK, PYTH]
    keywords:
      - real world assets
      - tokenization
      - treasuries
  L2:
    symbols: [ARB, OP]
    keywords:
      - layer 2
      - rollup
      - optimistic
      - arbitrum
      - optimism
  Memes:
